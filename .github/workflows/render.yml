name: render-video

# Runs when a job file is committed under jobs/. No secrets are used or stored;
# the built-in GITHUB_TOKEN only publishes the finished MP4 as a Release asset.
on:
  push:
    branches: [main]
    paths:
      - "jobs/*.json"
  workflow_dispatch:
    inputs:
      job:
        description: "Job file to render, e.g. jobs/smoke-test-001.json"
        required: true

permissions:
  contents: write

concurrency:
  group: render-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Ensure FFmpeg and fonts
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            timeout 240 sudo apt-get update -qq || true
            timeout 300 sudo apt-get install -y -qq ffmpeg || true
          fi
          timeout 120 sudo apt-get update -qq >/dev/null 2>&1 || true
          timeout 180 sudo apt-get install -y -qq fonts-dejavu-core fonts-inter >/dev/null 2>&1 || true
          fc-match "Inter:style=Medium" || true
          python3 -c "import cv2, numpy" 2>/dev/null || pip install --quiet --break-system-packages opencv-python-headless numpy
          python3 -c "import PIL" 2>/dev/null || pip install --quiet --break-system-packages pillow
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters 2>/dev/null | grep -E " drawtext | gradients " || true

      - name: Fetch DM Sans
        run: |
          python3 scripts/fetch_font.py
          ls -la fonts

      - name: Find job files
        id: jobs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "files=${{ github.event.inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            files=$(git diff-tree --no-commit-id --name-only -r --diff-filter=AM HEAD -- 'jobs/*.json' | tr '\n' ' ')
            echo "files=$files" >> "$GITHUB_OUTPUT"
          fi

      - name: Install rembg (cutout jobs only)
        run: |
          if grep -lE '"type": *"cutout"' ${{ steps.jobs.outputs.files }} >/dev/null 2>&1; then
            pip install --quiet --break-system-packages rembg onnxruntime || true
          fi

      - name: Install synth (music jobs only)
        run: |
          if grep -lE '"type": *"music"' ${{ steps.jobs.outputs.files }} >/dev/null 2>&1; then
            sudo apt-get install -y -qq fluidsynth fluid-soundfont-gm >/dev/null
            fluidsynth --version | head -1
          fi

      - name: Render and publish each job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          for f in ${{ steps.jobs.outputs.files }}; do
            id=$(python3 -c "import json;print(json.load(open('$f'))['id'])")
            if ! python3 scripts/render.py "$f"; then echo "::error::render $id"; rc=1; continue; fi
            tag="video-$id"
            assets=()
            for extra in "out/$id.json" "out/$id.mp4" "out/$id-contact.jpg" "out/$id-label-frame.jpg" out/$id-sheet*.jpg out/$id-still*.png out/$id-crop*.jpg out/$id-src*.jpg out/$id-*.wav out/$id-raw*.mp4 out/$id-vo.* out/$id-seg*.jpg out/$id-raw.mp4 out/$id-cutout*.* out/$id-last.png out/$id-first.png out/$id-at*.jpg out/$id-comp*.* out/$id-dbg*.*; do
              if [ -f "$extra" ]; then assets+=("$extra"); fi
            done
            echo "job $id assets: ${assets[*]}"
            if [ ${#assets[@]} -eq 0 ]; then echo "::error::no assets for $id"; rc=1; continue; fi
            ok=0
            for try in 1 2 3 4 5 6; do
              if gh release view "$tag" >/dev/null 2>&1; then
                out=$(gh release upload "$tag" "${assets[@]}" --clobber 2>&1) && { ok=1; break; }
              else
                out=$(gh release create "$tag" "${assets[@]}" --title "$id" --notes "Rendered by run ${{ github.run_id }}" --target "${{ github.sha }}" 2>&1) && { ok=1; break; }
              fi
              echo "retry $try $id: ${out//$'\n'/ | }"; sleep $((try*20))
            done
            if [ $ok -ne 1 ]; then echo "::error::publish $id: ${out//$'\n'/ | }"; rc=1; continue; fi
            echo "ok $tag"; sleep 4
          done
          if ls fonts/*.ttf >/dev/null 2>&1; then
            gh release view assets-fonts >/dev/null 2>&1 || gh release create assets-fonts fonts/*.ttf --title assets-fonts --notes fonts --target "${{ github.sha }}" || true
          fi
          exit $rc
